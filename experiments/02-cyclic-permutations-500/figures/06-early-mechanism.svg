<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img"><title>Reversals generate fewer early merges</title><rect width="840" height="430" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#172b3b"><text x="26" y="34" font-weight="bold" font-size="22">Reversals generate fewer early merges</text><text x="26" y="57" fill="#526477">First 12 attempted inputs, fresh replication; 44,000 attempts per shown category</text><line x1="245" y1="90" x2="245" y2="302" stroke="#dbe4eb"/><text x="245" y="322" text-anchor="middle">0.0</text><line x1="350" y1="90" x2="350" y2="302" stroke="#dbe4eb"/><text x="350" y="322" text-anchor="middle">0.2</text><line x1="455" y1="90" x2="455" y2="302" stroke="#dbe4eb"/><text x="455" y="322" text-anchor="middle">0.4</text><line x1="560" y1="90" x2="560" y2="302" stroke="#dbe4eb"/><text x="560" y="322" text-anchor="middle">0.6</text><line x1="665" y1="90" x2="665" y2="302" stroke="#dbe4eb"/><text x="665" y="322" text-anchor="middle">0.8</text><line x1="770" y1="90" x2="770" y2="302" stroke="#dbe4eb"/><text x="770" y="322" text-anchor="middle">1.0</text><text x="235" y="127" text-anchor="end" font-weight="bold">Circular: 90° turn</text><rect x="245" y="108" width="345.784090909091" height="31" fill="#087f8c" rx="3"/><text x="599.784090909091" y="128" font-weight="bold">0.659</text><text x="235" y="195" text-anchor="end" font-weight="bold">Other: 90° turn</text><rect x="245" y="176" width="444.3647727272728" height="31" fill="#64748b" rx="3"/><text x="698.3647727272728" y="196" font-weight="bold">0.846</text><text x="235" y="263" text-anchor="end" font-weight="bold">Other: 180° reversal</text><rect x="245" y="244" width="214.29545454545456" height="31" fill="#bd6b3c" rx="3"/><text x="468.29545454545456" y="264" font-weight="bold">0.408</text><text x="507.5" y="345" text-anchor="middle">Mean merges per attempted input</text><text x="26" y="385" font-size="13" font-weight="bold">First 12 inputs: circular games average 7.398 merges vs 7.053 in other games.</text><text x="26" y="414" fill="#526477" font-size="11">Observational transition comparison; board states and phases differ across categories.</text></g></svg>
