<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"><title>Held-out 2048 winning rates: human-oriented policies versus computational references</title><rect width="840" height="420" fill="#fff"/><g font-family="Arial,sans-serif" fill="#173243"><text x="25" y="36" font-size="22" font-weight="bold">2048 win rate on independent holdouts</text><text x="25" y="60" font-size="13">Human objective: over 50% with a simple rule; references use computation.</text><text x="280" y="115" font-size="13" text-anchor="end">Simple combined (n=200)</text><rect x="292" y="96" width="2.5" height="26" rx="3" fill="#64748b"/><text x="302.5" y="115" font-size="13">0.5%</text><text x="280" y="164" font-size="13" text-anchor="end">Empty + order, 2 moves (n=200)</text><rect x="292" y="145" width="0" height="26" rx="3" fill="#64748b"/><text x="300" y="164" font-size="13">0.0%</text><text x="280" y="213" font-size="13" text-anchor="end">Coarse stochastic (n=200)</text><rect x="292" y="194" width="120" height="26" rx="3" fill="#b77936"/><text x="420" y="213" font-size="13">24.0%</text><text x="280" y="262" font-size="13" text-anchor="end">More space reference (n=300)</text><rect x="292" y="243" width="245" height="26" rx="3" fill="#b77936"/><text x="545" y="262" font-size="13">49.0%</text><text x="280" y="311" font-size="13" text-anchor="end">Space 1080 reference (n=300)</text><rect x="292" y="292" width="366.6665" height="26" rx="3" fill="#087f8c"/><text x="666.6665" y="311" font-size="13">73.3%</text><path d="M542 83 V345" stroke="#b03b35" stroke-width="2" stroke-dasharray="6 4"/><text x="542" y="364" font-size="12" text-anchor="middle" fill="#b03b35">50% target</text><text x="25" y="399" font-size="12">No independent human playtest; computational references do not meet the simplicity constraint.</text></g></svg>
