<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><title>Mean scores of 9 periodic policy families</title><rect width="900" height="600" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#173243"><text x="26" y="36" font-size="22" font-weight="bold">Short periodic strategies: score by family</text><text x="26" y="61" font-size="13" fill="#526477">92,000 games, 500 seeds per pattern; original game rules</text><text x="307" y="115" text-anchor="end" font-size="13">4-step asymmetric, three directions</text><rect x="326" y="99" width="421.5157395348837" height="23" rx="4" fill="#0d9488"/><text x="757.5157395348838" y="115" font-size="13" font-weight="bold">3776</text><text x="307" y="163" text-anchor="end" font-size="13">6-step asymmetric, three directions</text><rect x="326" y="147" width="355.5185488372093" height="23" rx="4" fill="#20a4a0"/><text x="691.5185488372093" y="163" font-size="13" font-weight="bold">3185</text><text x="307" y="211" text-anchor="end" font-size="13">4-step circular, four directions</text><rect x="326" y="195" width="255.19490232558138" height="23" rx="4" fill="#64748b"/><text x="591.1949023255813" y="211" font-size="13" font-weight="bold">2286</text><text x="307" y="259" text-anchor="end" font-size="13">3-step, three directions</text><rect x="326" y="243" width="186.7853023255814" height="23" rx="4" fill="#8999a7"/><text x="522.7853023255814" y="259" font-size="13" font-weight="bold">1673</text><text x="307" y="307" text-anchor="end" font-size="13">6-step overlapping triples</text><rect x="326" y="291" width="155.11266976744184" height="23" rx="4" fill="#95a2ae"/><text x="491.11266976744184" y="307" font-size="13" font-weight="bold">1390</text><text x="307" y="355" text-anchor="end" font-size="13">12-step rolling triples</text><rect x="326" y="339" width="132.52926511627908" height="23" rx="4" fill="#a9b1b9"/><text x="468.5292651162791" y="355" font-size="13" font-weight="bold">1187</text><text x="307" y="403" text-anchor="end" font-size="13">4-step non-circular, four directions</text><rect x="326" y="387" width="121.3973581395349" height="23" rx="4" fill="#b7bec5"/><text x="457.3973581395349" y="403" font-size="13" font-weight="bold">1088</text><text x="307" y="451" text-anchor="end" font-size="13">3-step, two directions</text><rect x="326" y="435" width="14.278275968992247" height="23" rx="4" fill="#d77b49"/><text x="350.27827596899226" y="451" font-size="13" font-weight="bold">128</text><text x="307" y="499" text-anchor="end" font-size="13">2-step, two directions</text><rect x="326" y="483" width="12.849786046511628" height="23" rx="4" fill="#d77b49"/><text x="348.8497860465116" y="499" font-size="13" font-weight="bold">115</text><text x="26" y="578" font-size="12" fill="#526477">0 games reached 2048. Fixed policies are compared on the same 500 seeds.</text></g></svg>
