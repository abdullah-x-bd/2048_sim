<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346"><title>Held-out replication: reaching larger tiles</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#172b3b"><text x="24" y="33" font-size="22" font-weight="bold">Held-out replication: reaching larger tiles</text><text x="24" y="57" fill="#526477">16,000 biased and 8,000 circular games; percentage reaching threshold</text><text x="253" y="123" text-anchor="end" font-weight="bold">Biased: 512+</text><rect x="265" y="105" width="452.10156250000006" height="25" fill="#087f8c" rx="3"/><text x="725.1015625" y="123" >29.525%</text><text x="253" y="166" text-anchor="end" font-weight="bold">Circular: 512+</text><rect x="265" y="148" width="90.7265625" height="25" fill="#61768a" rx="3"/><text x="363.7265625" y="166" >5.925%</text><text x="253" y="209" text-anchor="end" font-weight="bold">Biased: 1024+</text><rect x="265" y="191" width="6.029296875" height="25" fill="#087f8c" rx="3"/><text x="279.029296875" y="209" >0.394%</text><text x="253" y="252" text-anchor="end" font-weight="bold">Circular: 1024+</text><rect x="265" y="234" width="0.19140625" height="25" fill="#61768a" rx="3"/><text x="273.19140625" y="252" >0.013%</text><text x="24" y="326" font-size="11" fill="#526477">No game reached 2048. Small 1024 bars reflect rare events, not zero.</text></g></svg>
