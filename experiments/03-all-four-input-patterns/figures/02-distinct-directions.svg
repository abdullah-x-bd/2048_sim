<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346"><title>Using fewer directions is not always better</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#172b3b"><text x="24" y="33" font-size="22" font-weight="bold">Using fewer directions is not always better</text><text x="24" y="57" fill="#526477">Mean score by number of distinct inputs in a four-step cycle</text><text x="253" y="123" text-anchor="end" font-weight="bold">1 distinct direction(s)</text><rect x="265" y="105" width="3.32073" height="25" fill="#61768a" rx="3"/><text x="276.32073" y="123" >13.6</text><text x="253" y="166" text-anchor="end" font-weight="bold">2 distinct direction(s)</text><rect x="265" y="148" width="33.15844" height="25" fill="#61768a" rx="3"/><text x="306.15844" y="166" >135.3</text><text x="253" y="209" text-anchor="end" font-weight="bold">3 distinct direction(s)</text><rect x="265" y="191" width="431.00694000000004" height="25" fill="#087f8c" rx="3"/><text x="704.00694" y="209" >1759.2</text><text x="253" y="252" text-anchor="end" font-weight="bold">4 distinct direction(s)</text><rect x="265" y="234" width="365.27874833333334" height="25" fill="#61768a" rx="3"/><text x="638.2787483333334" y="252" >1490.9</text><text x="24" y="326" font-size="11" fill="#526477">All three-direction patterns averaged together; strong variation exists within this group.</text></g></svg>
