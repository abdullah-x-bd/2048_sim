<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346"><title>Corner retention is not sufficient</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="13" fill="#172b3b"><text x="24" y="33" font-size="22" font-weight="bold">Corner retention is not sufficient</text><text x="24" y="57" fill="#526477">Discovery: pooled fraction of valid steps with a maximum tile in any corner</text><text x="253" y="123" text-anchor="end" font-weight="bold">Two-direction alternating</text><rect x="265" y="105" width="476.55099847765723" height="25" fill="#c18c38" rx="3"/><text x="749.5509984776572" y="123" >97.26%</text><text x="253" y="166" text-anchor="end" font-weight="bold">Other patterns</text><rect x="265" y="148" width="141.36912997259958" height="25" fill="#a6aeb8" rx="3"/><text x="414.3691299725996" y="166" >28.85%</text><text x="253" y="209" text-anchor="end" font-weight="bold">Circular</text><rect x="265" y="191" width="41.19022095056429" height="25" fill="#61768a" rx="3"/><text x="314.1902209505643" y="209" >8.41%</text><text x="253" y="252" text-anchor="end" font-weight="bold">Biased alternating</text><rect x="265" y="234" width="16.27665189476422" height="25" fill="#087f8c" rx="3"/><text x="289.2766518947642" y="252" >3.32%</text><text x="24" y="326" font-size="11" fill="#526477">Corner occupancy is descriptive, time-weighted and does not measure stable edge organisation.</text></g></svg>
